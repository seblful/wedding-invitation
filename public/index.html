<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Invitation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Corner Decorations -->
  <div class="corner-decoration top-left">
    <img src="images/background/flowers_TopLeft.png" alt="Flowers">
  </div>
  <div class="corner-decoration top-right">
    <img src="images/background/flowers_TopRight.png" alt="Flowers">
  </div>
  <div class="corner-decoration bottom-left">
    <img src="images/background/flowers_BottomLeft.png" alt="Flowers">
  </div>
  <div class="corner-decoration bottom-right">
    <img src="images/background/flowers_BottomRight.png" alt="Flowers">
  </div>

  <!-- Center Content -->
  <div class="center-content">
    <div class="faces-container">
      <img src="images/faces/Aliaksei.png" alt="Aliaksei" class="face-image">
      <img src="images/faces/Daria.png" alt="Daria" class="face-image">
    </div>
  </div>
</body>
</html>
